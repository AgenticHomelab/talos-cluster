apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller-crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/snapshot-controller/app
  # Removing an API definition would also remove its snapshot metadata.
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
