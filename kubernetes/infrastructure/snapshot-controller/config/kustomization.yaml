apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - upstream/rbac-snapshot-controller.yaml
  - upstream/setup-snapshot-controller.yaml
images:
  # The v8.6.0 release example still references v8.5.0; use its released image.
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.6.0
    digest: sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: snapshot-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CSIVolumeGroupSnapshot=false
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: snapshot-controller-runner
    patch: |-
      - op: test
        path: /rules/8/apiGroups
        value: [groupsnapshot.storage.k8s.io]
      - op: remove
        path: /rules/12
      - op: remove
        path: /rules/11
      - op: remove
        path: /rules/10
      - op: remove
        path: /rules/9
      - op: remove
        path: /rules/8
