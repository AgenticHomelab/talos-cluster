apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      vault: "${ESO_OCI_VAULT_OCID}"
      region: "${ESO_OCI_REGION}"
      principalType: UserPrincipal
      auth:
        user: "${ESO_OCI_USER_OCID}"
        tenancy: "${ESO_OCI_TENANCY_OCID}"
        secretRef:
          privatekey:
            name: oci-vault-auth
            namespace: external-secrets
            key: privatekey
          fingerprint:
            name: oci-vault-auth
            namespace: external-secrets
            key: fingerprint
