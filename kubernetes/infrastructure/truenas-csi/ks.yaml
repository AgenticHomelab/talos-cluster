apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: truenas-csi
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/truenas-csi/app
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: homelab-private-config
    - name: truenas-csi-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-private-vars
