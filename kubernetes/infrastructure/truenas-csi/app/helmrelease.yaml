apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
  namespace: truenas-csi
spec:
  interval: 30m
  targetNamespace: truenas-csi
  chart:
    spec:
      chart: truenas-csi
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: truenas-csi-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: truenas-csi-node
              spec:
                template:
                  spec:
                    volumes:
                      - name: iscsi-dir
                        hostPath:
                          type: DirectoryOrCreate
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    truenas:
      url: wss://truenas-api.${BASE_DOMAIN}:444/api/current
      defaultPool: tank
      nfsServer: ${NAS_HOST_IP}
      insecureSkipTLS: false
      existingSecret: truenas-csi-api
      existingSecretKey: api-key
    controller:
      replicas: 1
    volumeSnapshotClass:
      enabled: false
    storageClasses:
      - name: truenas-csi-pilot-delete
        isDefault: false
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - hard
          - nfsvers=4.1
        parameters:
          protocol: nfs
          datasetPath: k8s/csi-pilot/delete
          compression: LZ4
          nfs.hosts: ${TRUENAS_NFS_CLIENT_HOSTS}
      - name: truenas-csi-pilot-retain
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - hard
          - nfsvers=4.1
        parameters:
          protocol: nfs
          datasetPath: k8s/csi-pilot/retain
          compression: LZ4
          nfs.hosts: ${TRUENAS_NFS_CLIENT_HOSTS}
      - name: truenas-csi-production-retain
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - hard
          - nfsvers=4.1
          - sec=sys
        parameters:
          protocol: nfs
          datasetPath: k8s/csi
          compression: LZ4
          nfs.rootSquash: "false"
          nfs.hosts: ${TRUENAS_NFS_CLIENT_HOSTS}
      - name: truenas-csi-retain
        isDefault: false
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - hard
          - nfsvers=4.1
          - sec=sys
        parameters:
          protocol: nfs
          datasetPath: k8s/csi
          compression: LZ4
          nfs.rootSquash: "false"
          nfs.hosts: ${TRUENAS_NFS_CLIENT_HOSTS}
      - name: truenas-csi-delete
        isDefault: false
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - hard
          - nfsvers=4.1
          - sec=sys
        parameters:
          protocol: nfs
          datasetPath: k8s/csi
          compression: LZ4
          nfs.rootSquash: "false"
          nfs.hosts: ${TRUENAS_NFS_CLIENT_HOSTS}
