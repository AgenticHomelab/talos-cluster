apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-api
  namespace: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: truenas-csi-api
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-truenas-csi-truenas-csi-api
