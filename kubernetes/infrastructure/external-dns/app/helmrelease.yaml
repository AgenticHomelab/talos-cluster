apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      # renovate: datasource=helm depName=external-dns registryUrl=https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      version: "1.24.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: external-dns
    provider:
      name: cloudflare
    sources:
      - service
      - ingress
    domainFilters:
      - ${BASE_DOMAIN}
    policy: upsert-only
    registry: txt
    txtOwnerId: talos-homelab
    interval: 5m
    triggerLoopOnEvent: true
    managedRecordTypes:
      - CNAME
    logLevel: info
    logFormat: text
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: api-token
    extraArgs:
      cloudflare-dns-records-per-page: "5000"
      cloudflare-record-comment: "Managed by external-dns in talos-homelab"
      zone-id-filter: "${CLOUDFLARE_DNS_ZONE_ID}"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
