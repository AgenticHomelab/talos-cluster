apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas
  namespace: external-services
  annotations:
    network-exposure: internal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`truenas.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: truenas
          port: 81
          scheme: http
  tls:
    secretName: truenas-tls
