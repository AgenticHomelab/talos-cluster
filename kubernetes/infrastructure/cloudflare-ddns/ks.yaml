apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-ddns
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/cloudflare-ddns/app
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: homelab-private-config
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-private-vars
