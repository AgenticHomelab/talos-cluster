apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-config
  namespace: flux-system
spec:
  # Shared two-proxy egress was accepted; preserve the scoped rollout boundary.
  suspend: false
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/infrastructure/tailscale/config
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-private-vars
  dependsOn:
    - name: homelab-private-config
    - name: tailscale
