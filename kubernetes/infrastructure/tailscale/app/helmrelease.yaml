apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  # Operator and shared egress ProxyGroup are active following reviewed rollout.
  suspend: false
  interval: 30m
  chart:
    spec:
      # renovate: datasource=helm depName=tailscale-operator registryUrl=https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      version: "1.104.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  values:
    installCRDs: true
    ingressClass:
      enabled: false
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"
    operatorConfig:
      hostname: talos-home-operator
      defaultTags:
        - tag:k8s-operator
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi
    proxyConfig:
      defaultTags: tag:k8s
