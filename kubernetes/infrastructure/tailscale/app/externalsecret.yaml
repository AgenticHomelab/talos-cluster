apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: operator-oauth
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          k0ti.com/credential-status: provisioned
  dataFrom:
    - extract:
        key: k8s-tailscale-operator-oauth
