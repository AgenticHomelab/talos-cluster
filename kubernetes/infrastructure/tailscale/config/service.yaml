apiVersion: v1
kind: Service
metadata:
  name: control-01
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-fqdn: ${CONTROL01_TAILNET_FQDN}
    tailscale.com/proxy-group: talos-home-egress
    # Only the operator owns the resolved ExternalName after creation.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  type: ExternalName
  externalName: pending.invalid
  ports:
    - name: https
      port: 443
      protocol: TCP
