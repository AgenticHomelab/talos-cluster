apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  interval: 30m
  targetNamespace: cnpg-system
  chart:
    spec:
      # renovate: datasource=helm depName=plugin-barman-cloud registryUrl=https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: barman-cloud
        namespace: flux-system
      interval: 24h

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      strategy: rollback

  values:
    fullnameOverride: barman-cloud

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
