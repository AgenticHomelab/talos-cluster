apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flux-web
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: flux-web
  values:
    fullnameOverride: flux-web
    installCRDs: false
    web:
      serverOnly: true
