apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres-restore-test
  namespace: authentik
  labels:
    restore-purpose: quarterly-restore-test
spec:
  instances: 1

  bootstrap:
    recovery:
      source: authentik-postgres-backup

  externalClusters:
    - name: authentik-postgres-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: authentik-postgres-backups
          serverName: authentik-postgres

  storage:
    size: 10Gi
    storageClass: longhorn

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  monitoring:
    enablePodMonitor: false
