apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-matrix-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: authentik-matrix-oidc
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-matrix-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-s3
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: authentik-postgres-s3
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: ""
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-postgres-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-s3-ca
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: authentik-postgres-s3-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: ""
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-postgres-s3-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgres-user
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: authentik-postgres-user
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-postgres-user
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-values
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: authentik-values
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: "Enabled"
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-values
