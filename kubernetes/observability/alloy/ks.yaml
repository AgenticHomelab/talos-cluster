apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  # Active following credential handoff and reviewed production acceptance.
  suspend: false
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/observability/alloy/app
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-private-vars
  dependsOn:
    - name: homelab-private-config
    - name: external-secrets-config
    - name: longhorn
    - name: kube-state-metrics
    - name: metrics-server
    - name: tailscale-config
