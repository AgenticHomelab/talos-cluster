apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-logs
  namespace: metrics-server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-logs
  namespace: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: alloy
