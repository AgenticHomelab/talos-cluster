apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-logs-ingestion
  namespace: alloy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: talos-logs-ingestion
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-alloy-talos-logs-ingestion
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-metrics-ingestion
  namespace: alloy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: talos-metrics-ingestion
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-alloy-talos-metrics-ingestion
