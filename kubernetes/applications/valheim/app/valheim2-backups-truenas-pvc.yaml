apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valheim2-backups-truenas
  namespace: valheim
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-csi-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 50Gi
