apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-secret
  namespace: valheim
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: valheim-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-valheim-valheim-secret
