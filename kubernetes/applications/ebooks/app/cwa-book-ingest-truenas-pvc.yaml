apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cwa-book-ingest-truenas
  namespace: ebooks
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-csi-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 20Gi
