apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
  namespace: aiostreams
spec:
  interval: 30m
  timeout: 10m

  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      main:
        strategy: Recreate

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          main:
            image:
              repository: ghcr.io/viren070/aiostreams
              tag: v2.38.1
              pullPolicy: IfNotPresent

            ports:
              - name: http
                containerPort: 3000

            env:
              BASE_URL: https://aiostreams.${BASE_DOMAIN}
              DATABASE_URI: sqlite://./data/db.sqlite
              LOG_FORMAT: json
              LOG_LEVEL: info
              NODE_ENV: production
              NODE_OPTIONS: --max-old-space-size=768
              PORT: "3000"
              SYSTEM_LIFECYCLE_ENABLED: "false"
              REGEX_FILTER_ACCESS: "trusted"

              TRUSTED_UUIDS:
                valueFrom:
                  secretKeyRef:
                    name: aiostreams-secret
                    key: TRUSTED_UUIDS
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: aiostreams-secret
                    key: SECRET_KEY
              AIOSTREAMS_AUTH:
                valueFrom:
                  secretKeyRef:
                    name: aiostreams-secret
                    key: AIOSTREAMS_AUTH
              AIOSTREAMS_AUTH_REQUIRED: "true"
              AIOSTREAMS_AUTH_ADMINS: admin

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3

              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3000

    ingress:
      main:
        className: traefik
        annotations:
          network-exposure: internal
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/hostname: aiostreams.${BASE_DOMAIN}
          external-dns.kubernetes.io/target: traefik.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: aiostreams.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: aiostreams-tls
            hosts:
              - aiostreams.${BASE_DOMAIN}

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /app/data

      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
