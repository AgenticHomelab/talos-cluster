apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams
  namespace: aiostreams
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: aiostreams-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-aiostreams-aiostreams-secret
