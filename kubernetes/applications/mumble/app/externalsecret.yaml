apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mumble-superuser-password
  namespace: mumble
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: mumble-superuser-password
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-mumble-mumble-superuser-password
