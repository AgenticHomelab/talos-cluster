apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-signal-secrets
  namespace: matrix-signal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: mautrix-signal-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-matrix-signal-mautrix-signal-secrets
