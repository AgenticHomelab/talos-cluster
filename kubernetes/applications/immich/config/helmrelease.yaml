apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    createNamespace: false
    remediation:
      retries: 3
  # An image rollback cannot undo database migrations. Do not automatically
  # roll back or uninstall an established Immich release after a failed upgrade.
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
      valuesKey: values.yaml
