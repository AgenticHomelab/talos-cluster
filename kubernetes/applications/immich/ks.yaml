apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  # Includes CNPG/Barman, ExternalSecrets, network policies and TrueNAS CSI media.
  suspend: false
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/applications/immich/app
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: homelab-private-vars
  dependsOn:
    - name: homelab-private-config
    - name: external-secrets-config
    - name: barman-cloud
    - name: cloudnative-pg
    - name: longhorn
    - name: truenas-csi
