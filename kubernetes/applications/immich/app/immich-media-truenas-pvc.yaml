apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-media-truenas
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-csi-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Ti
