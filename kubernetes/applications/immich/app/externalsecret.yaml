apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-s3
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: immich-postgres-s3
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-immich-immich-postgres-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-s3-ca
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: immich-postgres-s3-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-authentik-authentik-postgres-s3-ca
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-user
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: immich-postgres-user
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: k8s-immich-immich-postgres-user
