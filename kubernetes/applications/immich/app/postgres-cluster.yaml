apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:f4007eb83db8e67d0b42e2ddf11d3368b490b1d35f02cc34b99a9c200877b104
          pullPolicy: IfNotPresent
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v1.1.1@sha256:bdea43bed2a414e21bbf71767bf6f0739747ac480b267b51772dc214ac28dcb3
          pullPolicy: IfNotPresent
        dynamic_library_path:
          - usr/lib/postgresql/18/lib
        extension_control_path:
          - usr/share/postgresql/18
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-postgres-user
      # CNPG runs bootstrap SQL as its local superuser; the app role does not
      # receive superuser or cluster-wide extension-management permissions.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS cube WITH SCHEMA public;
        - CREATE EXTENSION IF NOT EXISTS earthdistance WITH SCHEMA public;
        - CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public VERSION '0.8.7';
        - CREATE EXTENSION IF NOT EXISTS vchord WITH SCHEMA public VERSION '1.1.1';
        - ALTER DATABASE immich SET vchordrq.probes = 1;
  storage:
    size: 30Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  monitoring:
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-backups
