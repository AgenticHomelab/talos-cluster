apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgres-daily
  namespace: immich
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: immich-postgres
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
