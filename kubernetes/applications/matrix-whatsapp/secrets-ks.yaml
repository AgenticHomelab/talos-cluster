apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-whatsapp-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/applications/matrix-whatsapp/app
  # Retain existing Secrets during the staged ESO ownership handover.
  prune: false
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
