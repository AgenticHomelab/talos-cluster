apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mautrix-whatsapp-secrets
  namespace: matrix-whatsapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: mautrix-whatsapp-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-matrix-whatsapp-mautrix-whatsapp-secrets
