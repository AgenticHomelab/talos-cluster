apiVersion: batch/v1
kind: CronJob
metadata:
  name: borgwarehouse-maintenance
  namespace: borgwarehouse
spec:
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: curl
              image: curlimages/curl:8.23.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  curl -fsS -X POST \
                    -H "Authorization: Bearer $CRONJOB_KEY" \
                    http://borgwarehouse-web:3000/api/v1/cron/status
                  curl -fsS -X POST \
                    -H "Authorization: Bearer $CRONJOB_KEY" \
                    http://borgwarehouse-web:3000/api/v1/cron/storage
              env:
                - name: CRONJOB_KEY
                  valueFrom:
                    secretKeyRef:
                      name: borgwarehouse-secret
                      key: CRONJOB_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL