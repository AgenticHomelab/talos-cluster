apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: borgwarehouse-secret
  namespace: borgwarehouse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: borgwarehouse-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-borgwarehouse-borgwarehouse-secret
