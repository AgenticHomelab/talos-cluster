apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: borgwarehouse-truenas
  namespace: borgwarehouse
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: truenas-csi-production-retain
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Ti
