apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 30m
  timeout: 10m

  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    strategy:
      name: RemediateOnFailure
    remediation:
      # Application-managed SQLite migrations cannot be undone by Helm.
      retries: 0
      remediateLastFailure: false

  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.5-alpine
              pullPolicy: IfNotPresent

            env:
              DOMAIN: https://vw.${BASE_DOMAIN}
              SIGNUPS_ALLOWED: "false"

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3

              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3

            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi

    service:
      main:
        controller: main
        ports:
          http:
            port: 80

    ingress:
      main:
        className: traefik
        annotations:
          network-exposure: internal
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/hostname: vw.${BASE_DOMAIN}
          external-dns.kubernetes.io/target: traefik.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: vw.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http

              - path: /notifications/hub/negotiate
                pathType: Prefix
                service:
                  identifier: main
                  port: http

              - path: /notifications/hub
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: vaultwarden-tls
            hosts:
              - vw.${BASE_DOMAIN}

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 5Gi
        retain: true
        globalMounts:
          - path: /data
