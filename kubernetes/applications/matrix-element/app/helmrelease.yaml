apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-element
  namespace: matrix-element
spec:
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
      remediateLastFailure: true
  rollback:
    cleanupOnFail: true
  values:
    controllers:
      element:
        replicas: 1
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            image:
              # renovate: datasource=docker depName=vectorim/element-web
              repository: vectorim/element-web
              tag: v1.12.35
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 80
            probes:
              startup:
                enabled: true
                type: HTTP
              readiness:
                enabled: true
                type: HTTP
              liveness:
                enabled: true
                type: HTTP
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
    service:
      main:
        controller: element
        ports:
          http:
            port: 80
    ingress:
      main:
        className: traefik
        annotations:
          network-exposure: internal
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/hostname: chat.${BASE_DOMAIN}
          external-dns.kubernetes.io/target: traefik.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: chat.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: matrix-element-tls
            hosts:
              - chat.${BASE_DOMAIN}
    persistence:
      config:
        enabled: true
        type: configMap
        name: element-web-config
        advancedMounts:
          element:
            main:
              - path: /app/config.json
                subPath: config.json
                readOnly: true
