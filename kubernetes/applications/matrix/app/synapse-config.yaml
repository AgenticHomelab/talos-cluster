apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
data:
  homeserver.yaml: |
    server_name: ${BASE_DOMAIN}
    public_baseurl: https://matrix.${BASE_DOMAIN}/
    pid_file: /tmp/homeserver.pid
    signing_key_path: /run/secrets/synapse-signing/homeserver.signing.key
    media_store_path: /data/media_store
    max_upload_size: 100M
    enable_authenticated_media: true
    report_stats: false

    listeners:
      - port: 8008
        bind_addresses:
          - 0.0.0.0
        type: http
        tls: false
        x_forwarded: true
        resources:
          - names:
              - client
              - federation
            compress: true

    database:
      name: psycopg2
      args:
        host: matrix-postgres-rw.matrix.svc.cluster.local
        port: 5432
        database: synapse
        user: synapse
        password: __POSTGRES_PASSWORD__
        cp_min: 2
        cp_max: 10

    enable_registration: false
    allow_guest_access: false
    enable_room_list_search: false
    url_preview_enabled: false

    matrix_authentication_service:
      enabled: true
      endpoint: http://matrix-mas.matrix.svc.cluster.local:8080
      secret_path: /run/secrets/mas/matrix-shared-secret

    app_service_config_files:
      - /run/secrets/appservices/signal-registration.yaml
      - /run/secrets/appservices/double-puppet-registration.yaml
      - /run/secrets/whatsapp-appservice/whatsapp-registration.yaml

    experimental_features:
      msc3202_transaction_extensions: true
      msc2409_to_device_messages_enabled: true

    trusted_key_servers:
      - server_name: matrix.org
