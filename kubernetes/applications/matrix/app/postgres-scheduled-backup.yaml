apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: matrix-postgres-daily
  namespace: matrix
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: matrix-postgres
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
