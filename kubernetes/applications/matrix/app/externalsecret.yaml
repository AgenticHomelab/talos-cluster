apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-mas-secrets
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: oci-vault
  target:
    name: matrix-mas-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s-matrix-matrix-mas-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-postgres-mas
