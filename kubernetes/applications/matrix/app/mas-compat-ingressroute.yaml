apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-mas-compat
  namespace: matrix
  annotations:
    network-exposure: public
spec:
  entryPoints:
    - websecure-pub
  routes:
    - kind: Rule
      match: Host(`matrix.${BASE_DOMAIN}`) && PathRegexp(`^/_matrix/client/[^/]+/(login(/.*)?|logout|refresh)$`)
      priority: 100
      services:
        - kind: Service
          name: matrix-mas
          port: 8080
  tls:
    secretName: matrix-tls
