apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix
  namespace: matrix
spec:
  interval: 30m
  timeout: 15m

  chartRef:
    kind: OCIRepository
    name: bjw-s-app-template
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 1
      strategy: rollback
      remediateLastFailure: true

  rollback:
    cleanupOnFail: true

  values:
    controllers:
      synapse:
        replicas: 1
        revisionHistoryLimit: 3
        strategy: Recreate

        pod:
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 991
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        initContainers:
          config:
            image:
              repository: matrixdotorg/synapse
              tag: v1.166.0
              pullPolicy: IfNotPresent
            command:
              - python
              - -c
              - |
                import os
                from pathlib import Path
                source = Path("/config-template/homeserver.yaml").read_text()
                rendered = source.replace("__POSTGRES_PASSWORD__", os.environ["POSTGRES_PASSWORD"])
                Path("/config/homeserver.yaml").write_text(rendered)
            env:
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: matrix-postgres-synapse
                    key: password

        containers:
          main:
            image:
              # renovate: datasource=docker depName=matrixdotorg/synapse
              repository: matrixdotorg/synapse
              tag: v1.166.0
              pullPolicy: IfNotPresent
            env:
              SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
            ports:
              - name: http
                containerPort: 8008
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SETGID
                  - SETUID

      discovery:
        replicas: 2
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        containers:
          main:
            image:
              # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
              repository: nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine
              pullPolicy: IfNotPresent
            ports:
              - name: http
                containerPort: 8080
            probes:
              readiness:
                enabled: true
              liveness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

      mas:
        replicas: 1
        revisionHistoryLimit: 3
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          config:
            image:
              # renovate: datasource=docker depName=busybox
              repository: busybox
              tag: 1.38.0
              pullPolicy: IfNotPresent
            command:
              - sh
              - -ec
              - |
                sed \
                  -e "s|__DATABASE_PASSWORD__|$DATABASE_PASSWORD|g" \
                  -e "s|__ENCRYPTION_SECRET__|$ENCRYPTION_SECRET|g" \
                  /config-template/secrets.yaml > /config/secrets.yaml
            env:
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: matrix-postgres-mas
                    key: password
              ENCRYPTION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: matrix-mas-secrets
                    key: encryption
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/element-hq/matrix-authentication-service
              repository: ghcr.io/element-hq/matrix-authentication-service
              tag: 1.30.0
              pullPolicy: IfNotPresent
            args:
              - -c
              - /config-template/config.yaml
              - -c
              - /config/secrets.yaml
              - server
            ports:
              - name: http
                containerPort: 8080
              - name: health
                containerPort: 8081
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: health
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: health
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: health
                  periodSeconds: 30
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    service:
      synapse:
        controller: synapse
        ports:
          http:
            port: 8008
      discovery:
        controller: discovery
        ports:
          http:
            port: 8080
      mas:
        controller: mas
        ports:
          http:
            port: 8080

    ingress:
      synapse:
        className: traefik
        annotations:
          network-exposure: public
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/target: home.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure-pub
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: matrix.${BASE_DOMAIN}
            paths:
              - path: /_matrix
                pathType: Prefix
                service:
                  identifier: synapse
                  port: http
        tls:
          - secretName: matrix-tls
            hosts:
              - matrix.${BASE_DOMAIN}

      discovery:
        className: traefik
        annotations:
          network-exposure: public
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/target: home.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure-pub
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: ${BASE_DOMAIN}
            paths:
              - path: /.well-known/matrix/server
                pathType: Exact
                service:
                  identifier: discovery
                  port: http
              - path: /.well-known/matrix/client
                pathType: Exact
                service:
                  identifier: discovery
                  port: http
        tls:
          - secretName: matrix-discovery-tls
            hosts:
              - ${BASE_DOMAIN}

      mas:
        className: traefik
        annotations:
          network-exposure: public
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.kubernetes.io/target: home.${BASE_DOMAIN}
          external-dns.kubernetes.io/cloudflare-proxied: "false"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure-pub
          traefik.ingress.kubernetes.io/router.tls: "true"
        hosts:
          - host: matrix-auth.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: mas
                  port: http
        tls:
          - secretName: matrix-mas-tls
            hosts:
              - matrix-auth.${BASE_DOMAIN}

    persistence:
      media:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/default: enabled
        advancedMounts:
          synapse:
            main:
              - path: /data

      config-template:
        enabled: true
        type: configMap
        name: synapse-config
        advancedMounts:
          synapse:
            config:
              - path: /config-template
                readOnly: true

      config:
        enabled: true
        type: emptyDir
        advancedMounts:
          synapse:
            config:
              - path: /config
            main:
              - path: /config
                readOnly: true

      signing-key:
        enabled: true
        type: secret
        name: synapse-signing-key
        advancedMounts:
          synapse:
            main:
              - path: /run/secrets/synapse-signing
                readOnly: true

      mas-config-template:
        enabled: true
        type: configMap
        name: matrix-mas-config
        advancedMounts:
          mas:
            config:
              - path: /config-template
                readOnly: true
            main:
              - path: /config-template
                readOnly: true

      mas-config:
        enabled: true
        type: emptyDir
        advancedMounts:
          mas:
            config:
              - path: /config
            main:
              - path: /config
                readOnly: true

      mas-secrets:
        enabled: true
        type: secret
        name: matrix-mas-secrets
        advancedMounts:
          synapse:
            main:
              - path: /run/secrets/mas
                readOnly: true
          mas:
            main:
              - path: /run/secrets/mas
                readOnly: true

      signal-registration:
        enabled: true
        type: secret
        name: matrix-signal-registration
        advancedMounts:
          synapse:
            main:
              - path: /run/secrets/appservices
                readOnly: true

      whatsapp-registration:
        enabled: true
        type: secret
        name: matrix-whatsapp-registration
        advancedMounts:
          synapse:
            main:
              - path: /run/secrets/whatsapp-appservice
                readOnly: true

      discovery-config:
        enabled: true
        type: configMap
        name: matrix-discovery
        advancedMounts:
          discovery:
            main:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
