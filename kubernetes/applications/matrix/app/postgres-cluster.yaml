apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres
  namespace: matrix
spec:
  instances: 3

  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/default: enabled

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred

  bootstrap:
    initdb:
      database: synapse
      owner: synapse
      secret:
        name: matrix-postgres-synapse

  managed:
    roles:
      - name: mas
        login: true
        passwordSecret:
          name: matrix-postgres-mas
      - name: mautrix_signal
        login: true
        passwordSecret:
          name: matrix-postgres-mautrix-signal
      - name: mautrix_whatsapp
        login: true
        passwordSecret:
          name: matrix-postgres-mautrix-whatsapp
      - name: mautrix_discord
        login: true
        passwordSecret:
          name: matrix-postgres-mautrix-discord

  storage:
    # Recovery headroom for WAL retained during an archive-target outage.
    # Archive health still requires intervention; this is not a WAL size cap.
    size: 50Gi
    storageClass: longhorn

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-postgres-backups
