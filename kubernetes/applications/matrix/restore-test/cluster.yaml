apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-postgres-restore-test
  namespace: matrix
  labels:
    restore-purpose: quarterly-restore-test
spec:
  instances: 1
  bootstrap:
    recovery:
      source: matrix-postgres-backup
  externalClusters:
    - name: matrix-postgres-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: matrix-postgres-backups
          serverName: matrix-postgres
  storage:
    size: 20Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
